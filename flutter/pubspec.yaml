name: agenda_amiga_flutter
description: "Agenda Amiga Mobile - Aplicativo Flutter 100% Offline com Voz Natural e Privilégios 24h para Idosos e Pessoas Esquecidas."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_tts: 4.2.5
  intl: ^0.20.2
  flutter_local_notifications: 22.3.0
  flutter_timezone: ^5.1.0
  timezone: 0.11.1
  speech_to_text: 7.4.0
  url_launcher: 6.3.2
  audioplayers: ^6.8.1
  workmanager: 0.5.2
  alarm: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alarm_sound.wav
